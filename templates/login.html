{% extends "base.html" %}
{% block content %}

<section class="auth-shell">
  <div class="auth-card">
    <div class="auth-card__header">
      <h1>Welcome Back!</h1>
      <p>Login to your account</p>
    </div>

    <form method="post" class="auth-form">
      <label>Username</label>
      <input name="username" placeholder="Enter your username" required>

      <label>Password</label>
      <input name="password" type="password" placeholder="Enter your password" required>

      <div class="auth-meta">
        <span>Secure staff and admin access</span>
        <a href="{{ url_for('signup') }}">Create account</a>
      </div>

      <button class="btn auth-btn auth-btn--blue" type="submit">Log In</button>
    </form>

    <div class="auth-divider"><span>Emergency Management System</span></div>
  </div>
</section>

{% endblock %}
