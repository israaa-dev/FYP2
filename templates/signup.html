{% extends "base.html" %}
{% block content %}

<section class="auth-shell">
  <div class="auth-card auth-card--signup">
    <div class="auth-card__header">
      <h1>Create an Account</h1>
      <p>Sign up to get started</p>
    </div>

    <form method="post" class="auth-form">
      <label>Full Name</label>
      <input name="full_name" placeholder="Full name" required>

      <label>Username</label>
      <input name="username" placeholder="Choose a username" required>

      <label>Password</label>
      <input name="password" type="password" placeholder="Create password" required>

      <div class="auth-meta">
        <span>Citizens can track requests after signup</span>
        <a href="{{ url_for('login') }}">Log in</a>
      </div>

      <button class="btn auth-btn auth-btn--green" type="submit">Sign Up</button>
    </form>

    <div class="auth-divider"><span>Emergency Management System</span></div>
  </div>
</section>

{% endblock %}
