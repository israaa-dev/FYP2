{% extends "base.html" %}
{% block content %}

<h2 class="page-title">Submit Emergency Request</h2>

<div class="glass-form-wrapper">
  <form method="post" class="glass-form">

    <label>Emergency Type</label>
    <select name="emergency_type" required>
      <option value="">-- Select --</option>
      <option>Trauma</option>
      <option>Cardiac</option>
      <option>Pediatric</option>
      <option>Burn</option>
      <option>Other</option>
    </select>

    <label>Your Location</label>
    <input name="location" placeholder="e.g., Gaza City - Street ..." required>

    <label>Select Hospital</label>
    <select name="hospital_id" required>
      <option value="">-- Select Hospital --</option>
      {% for h in hospitals %}
        <option value="{{ h.id }}">
          {{ h.name }} - {{ h.location }} ({{ h.status }}, Beds: {{ h.available_beds }})
        </option>
      {% endfor %}
    </select>

    <label>Description (optional)</label>
    <textarea name="description" rows="4" placeholder="Any details..."></textarea>

    <button class="btn" type="submit">Submit Request</button>
  </form>
</div>

{% endblock %}
